quarkus.http.port=8080
quarkus.http.host=0.0.0.0
quarkus.jackson.fail-on-unknown-properties=false

# API key used by the Paper plugin via X-API-Key.
minecraft.api-key=${MINECRAFT_API_KEY:change-me}

# GitHub Projects v2 settings.
github.token=${GITHUB_TOKEN:}
github.org=${GITHUB_ORG:your-org}
github.project-number=${GITHUB_PROJECT_NUMBER:1}
github.repository=${GITHUB_REPOSITORY:your-org/your-repo}
github.graphql-url=${GITHUB_GRAPHQL_URL:https://api.github.com/graphql}

# LLM integration target (read-only discovery from llm-hosting namespace).
llm.enabled=${LLM_ENABLED:false}
llm.base-url=${LLM_BASE_URL:}
llm.model=${LLM_MODEL:local-model}

quarkus.log.category."com.example.minecraftjira".level=INFO
