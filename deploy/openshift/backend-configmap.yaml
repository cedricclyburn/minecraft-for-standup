apiVersion: v1
kind: ConfigMap
metadata:
  name: minecraft-backend-config
  namespace: minecraft
data:
  GITHUB_ORG: your-org
  GITHUB_PROJECT_NUMBER: "1"
  GITHUB_REPOSITORY: your-org/your-repo
  LLM_ENABLED: "false"
  # Read-only discovered endpoint from llm-hosting namespace (do not edit llm-hosting resources).
  LLM_BASE_URL: https://llm-inference-llm-hosting.apps.cluster.example.com/v1/chat/completions
  LLM_MODEL: local-model
